name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Audit gate: compile every runtime component used by the Windows install.
      - name: Compile all runtime files
        run: python -m py_compile continuity.py runtime.py supervisor.py supervisor_hook.py control.py install.py updater.py uninstall.py
      - name: Behavioral unit tests
        run: python -m unittest discover -s tests -v
