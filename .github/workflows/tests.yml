name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Audit gate: compile every runtime component used by the Windows install.
      - name: Compile all runtime files
        run: python -m py_compile continuity.py runtime.py supervisor.py supervisor_hook.py control.py install.py updater.py uninstall.py
      - name: Behavioral unit tests
        run: python -m unittest discover -s tests -v
