name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      # Audit gate: compile every runtime component used by the Windows install.
      - name: Compile all runtime files
        run: python -m py_compile continuity.py runtime.py supervisor.py supervisor_hook.py control.py install.py updater.py uninstall.py
      - name: Behavioral unit tests
        run: python -m unittest discover -s tests -v
